version: "0.1"
updated: "2026-06-20"
status: active
purpose: >
  Natural-language request routing map for this Data Agent knowledge workspace.
  This file is a control-plane map: it defines where an agent should look first,
  which assets are canonical, and which areas must not be used as default facts.
  It does not define new business metrics or promote draft knowledge.

routing_principles:
  - Route from task type before reading broad content.
  - Prefer canonical owners over duplicated summaries.
  - Prefer verified SQL and semantic contracts over ad hoc SQL generation.
  - Treat raw, draft, TODO, historical snapshots, and handoff files as leads only.
  - Check freshness before giving current-window conclusions.
  - Mark owner-only business decisions as needs_decision instead of deciding them.

# Slim control plane only. Heavy indexes (semantic model.json, da_assets/index.yaml,
# knowledge catalog, per-task protocols) are NOT loaded here; they are pulled on
# demand via task_routes/<id>.yaml first_read after the task type is picked.
# Rationale and sizing: data_agent_plan/知识库三层结构规范.md.
default_bootstrap:
  - README.md
  - AGENTS.md
  - AGENT_RETRIEVAL_MAP.yaml
  - task_routes/INDEX.yaml
  - ai_hive/agent_manifest.yaml
  - ai_ck/agent_manifest.yaml
  - knowledge/agent_manifest.yaml
  - knowledge/agent_knowledge/policies/默认召回边界与晋升规则.md
  - TODO/README.md

never_default_recall:
  - raw_exports/
  - da_assets/raw/
  - knowledge/audit_archive/draft_knowledge/
  - ai_ck/audit_archive/table_profiles_raw_dump/
  - knowledge/audit_archive/semantic_contract/
  - data_agent_plan/MJ_DT与P3交接任务.md
  - data_agent_plan/*.json

# Human-facing reference directories: kept on purpose, but not canonical fact
# owners and not default-recall. Every top-level directory must be classified
# as a canonical_owner, never_default_recall, or reference_only_dirs entry
# (enforced by check_agent_retrieval_map.py top-level coverage check).
reference_only_dirs:
  - showoff/
  - 关键问题记录/
  - 术语解释/

canonical_owners:
  - id: maxcompute_table_knowledge
    owns:
      - MaxCompute table schema
      - MaxCompute table query rules
      - MaxCompute PII and partition guidance
      - MaxCompute table freshness source list
    path: ai_hive/
    index:
      - ai_hive/agent_manifest.yaml
      - ai_hive/agent_knowledge/catalog.yaml
      - ai_hive/agent_knowledge/口径决策记录.md
    notes:
      - Do not copy full table semantics into route or plan files.

  - id: clickhouse_mi_table_knowledge
    owns:
      - ClickHouse table schema
      - MI ROI360 table and view usage
      - ClickHouse metric sanity and profile recall
    path: ai_ck/
    index:
      - ai_ck/agent_manifest.yaml
      - ai_ck/agent_knowledge/catalog.yaml
      - ai_ck/agent_knowledge/metrics/
    notes:
      - CK is the reporting and OLAP layer; MC remains the training and label fact source.

  - id: cross_source_semantic_contract
    owns:
      - entities
      - dimensions
      - metrics
      - joins
      - diagnostics
      - governance fields
    path: knowledge/agent_knowledge/semantic_contract/
    index:
      - knowledge/agent_knowledge/semantic_contract/agent_manifest.yaml
      - knowledge/agent_knowledge/semantic_contract/model.json
      - knowledge/agent_knowledge/semantic_contract/README.md
    notes:
      - model.json is the machine-readable contract; do not hand-edit generated output.

  - id: business_policy_and_protocol
    owns:
      - analysis protocol
      - ROI governance policy
      - business decision boundaries
      - current confirmed or trial policy documents
    path: knowledge/
    index:
      - knowledge/agent_knowledge/catalog.yaml
      - knowledge/agent_knowledge/policies/默认召回边界与晋升规则.md
      - knowledge/agent_knowledge/policies/第一层分析Agent协议.md
      - knowledge/agent_knowledge/policies/AB3实验ID提取规则.md
      - knowledge/agent_knowledge/policies/BB大埋点字典使用规则.md
      - knowledge/agent_knowledge/policies/BB商业化埋点查询规则.md
      - knowledge/agent_knowledge/policies/商业化SQL协议.md
      - knowledge/agent_knowledge/policies/游戏核心指标口径语义.md
      - knowledge/agent_knowledge/policies/局轮出块粒度查询规则.md
      - knowledge/agent_knowledge/policies/实验配置与方案查询规则.md
      - knowledge/agent_knowledge/policies/特征工程与埋点元数据查询规则.md
      - knowledge/agent_knowledge/policies/皇家搓麻BI看板查询规则.md
      - knowledge/agent_knowledge/policies/SQL表路由协议.md
      - knowledge/agent_knowledge/policies/投放与ROI预估SQL协议.md
      - knowledge/agent_knowledge/policies/白名单事件表查询协议.md
      - knowledge/agent_knowledge/policies/用户行为留存画像查询规则.md
      - knowledge/agent_knowledge/policies/小包广告单元映射.md
      - knowledge/agent_knowledge/policies/小包广告单元映射.csv
      - knowledge/agent_knowledge/policies/投放ROI治理政策.md
      - knowledge/agent_knowledge/report_knowledge/包体ROI目标阈值.md
    notes:
      - knowledge/draft_knowledge is explicitly excluded from default recall.

  - id: reusable_analysis_assets
    owns:
      - verified SQL
      - candidate SQL
      - analysis SOP
      - decision cases
      - report intake evidence registry
    path: da_assets/
    index:
      - da_assets/index.yaml
      - da_assets/SQL晋升治理.md
      - da_assets/报告证据结构.md
    notes:
      - verified_sql is default-recall eligible; raw and candidate assets are not.

  - id: local_agent_skills
    owns:
      - DOCX report intake workflow
      - MI ROI360 page analysis workflow
      - task-specific reference routing
    path: skills/
    index:
      - skills/README.md
      - skills/docx报告入库技能/SKILL.md
      - skills/mi_skill/SKILL.md
    notes:
      - Skills are executable routing and workflow instructions, not independent business fact sources.

  - id: regression_and_gates
    owns:
      - agent regression
      - table-card quality gate
      - SQL promotion gate
      - knowledge consistency gate
      - retrieval-map gate
    path: eval/
    index:
      - eval/README.md
      - eval/agent_regression/regression_cases.yaml
    notes:
      - Gate reports summarize current engineering consistency, not business approval.

  - id: maintenance_tools
    owns:
      - refresh scripts
      - quality checks
      - runbooks
      - export tooling
    path: tools/
    index:
      - tools/README.md
      - tools/scripts/README.md
      - tools/runbooks/README.md

  - id: backlog_and_owner_questions
    owns:
      - near-term TODO
      - DA and UA questions
      - unresolved owner decisions
      - tool backlog
    path: TODO/
    index:
      - TODO/README.md
    notes:
      - TODO is not a fact source. Use it to mark needs_decision or missing evidence.

  - id: long_term_plan_and_snapshots
    owns:
      - roadmap
      - POC readiness snapshots
      - historical handoff
      - gap reports
    path: data_agent_plan/
    index:
      - data_agent_plan/README.md
      - data_agent_plan/DataAgent推进路线图.md
      - data_agent_plan/POC前置条件检查.md
    notes:
      - Plan snapshots are not current facts unless refreshed by the snapshot script.

  - id: task_routing
    owns:
      - per-task-type retrieval routing
      - per-task first_read, allowed_assets, output_guardrails
    path: task_routes/
    index:
      - task_routes/INDEX.yaml
    notes:
      - One task type per file (task_routes/<id>.yaml); INDEX.yaml is the lightweight router.
      - Validated by tools/scripts/check_agent_retrieval_map.py.

metadata_contract:
  required_for_default_recall:
    - status
    - default_recall
    - confidence
    - source_type
    - freshness_required
    - owner_decision_required
  status_meaning:
    verified: "Validated and eligible for default use within its stated scope."
    confirmed: "Business or implementation-confirmed policy or metric."
    trial_active: "Current trial policy; usable only with trial labeling."
    candidate_sql: "SQL candidate; not default recall until promoted."
    draft: "Lead or working note; not a fact."
    raw: "Original evidence; extraction required before use."
    needs_decision: "Owner decision is required; do not decide in-agent."
    snapshot: "Historical or point-in-time view; verify before treating as current."

promotion_paths:
  report_intake:
    from: raw_exports/
    through:
      - da_assets/raw/
      - da_assets/analysis_sop/
      - da_assets/verified_sql/
      - da_assets/decision_cases/
    update:
      - da_assets/index.yaml
  sql_promotion:
    from: da_assets/candidate_sql/
    through:
      - small-window validation
      - source and freshness notes
      - SQL promotion gate
    to: da_assets/verified_sql/
    update:
      - da_assets/index.yaml
      - da_assets/SQL晋升指标报告.md
  semantic_promotion:
    from:
      - da_assets/verified_sql/
      - ai_hive/agent_knowledge/tables/
      - ai_ck/agent_knowledge/tables/
      - knowledge/agent_knowledge/policies/
    to: knowledge/agent_knowledge/semantic_contract/
    update:
      - knowledge/agent_knowledge/semantic_contract/model.json
      - knowledge/engineering_artifacts/semantic_contract/eval/回归验证报告.md
  owner_decision_promotion:
    from: TODO/
    to:
      - knowledge/
      - knowledge/agent_knowledge/semantic_contract/
      - da_assets/decision_cases/
    rule: >
      Only promote after user, DA, UA, algorithm owner, or business owner decision.

task_routing:
  index: task_routes/INDEX.yaml
  dir: task_routes/
  rule: >
    Read task_routes/INDEX.yaml to route by trigger, then load only the matched
    task_routes/<id>.yaml. Per-task first_read / allowed_assets / output_guardrails /
    completion_boundary live in that file and are validated by
    tools/scripts/check_agent_retrieval_map.py.

output_contract:
  always_include_when_relevant:
    - data_source
    - route_taken
    - freshness_status
    - verified_asset_or_sql_source
    - confidence
    - needs_decision
    - snapshot_vs_live_probe
  forbid:
    - treating raw/draft/TODO as verified facts
    - treating old snapshots as current facts without refresh
    - returning campaign stop/scale/budget actions without human authorization
    - printing secrets or user-level detail
