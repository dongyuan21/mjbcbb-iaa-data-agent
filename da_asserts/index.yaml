intake_checklist:
- 记录 source URL 或文件名。
- 明确业务问题（business question）。
- 识别表名、维度、指标、过滤条件与时间窗口。
- 标注 SQL 是否已执行与已验证。
- 标注 SQL 的 promotion status 与 validation method。
- 记录 SQL 资产的 last_validated_at、owner 与 supersedes。
- 标注 MCP 读取状态与图片处理状态。
- 标注是否存在需排除在 agent 上下文之外的敏感细节。
promotion_gate_checklist:
  gate_a_structure:
  - 原始素材存在且可定位。
  - 业务问题已记录。
  - 已记录时间粒度、输出粒度、指标、维度、过滤条件与依赖表。
  - 风险项与注意事项已记录。
  gate_b_execution:
  - SQL 已在安全时间窗口执行，或已与可信产出进行对账。
  - 已记录验证日期、方法、参数与结果摘要。
  - 已记录 PII 或用户级明细处理方式。
  gate_c_recall:
  - 只有 verified_sql / semantic_promoted 才可进入默认召回。
  - Draft、candidate_sql、validated_sql、needs_decision 必须标为受限或待确认。
sql_status_values:
  missing_source_sql: 源报告尚未有可直接复用的 SQL。
  draft_sql_needed: 需先按 SOP 要求补齐 SQL 后再使用。
  copied_unverified: 从源材料拷贝后未执行。
  copied_partial_validated: 从源材料拷贝并做了安全聚合核验，但尚未达到可复用标准。
  verified: 已按日期过滤条件执行并完成结果复核。
promotion_status_values:
  raw: 仅原始素材，不作为 SQL 参考。
  draft: 备稿中的知识或分析，默认不可召回。
  candidate_sql: SQL 存在但未通过 verified gate。
  validated_sql: 通过了小窗口安全校验，但尚未成为稳定可复用参考。
  verified_sql: 通过结构与执行 gate，可进入默认召回。
  semantic_promoted: SQL/指标已入 semantic_contract 或稳定诊断层。
  needs_decision: 业务定义、阈值或动作仍需 owner 决策。
  deprecated: 不再推荐使用，保留用于追溯。
  superseded: 不要直接默认使用，按 supersedes 链接切换到替换版本。
validation_method_values:
  manual_small_window: 人工执行带日期/分区过滤的小窗口查询，并复核聚合结果。
  manual_reconciliation: 人工与可信 dashboard/report 或跨源产出完成对账。
  live_mc_window_validation: 在 MaxCompute 做有界日期窗口在线执行，并复核聚合结果。
  live_ck_window_validation: 在 ClickHouse 做有界日期窗口在线执行，并复核聚合结果。
  online_template_rerun_with_t_plus_1_guardrail: 模板在线重跑，覆盖 install-time 业务窗口和含 T+1/latest partition 的 dt 扫描窗口。
  online_desc_and_common_partition_reconciliation: 在线 DESC + 相关表的分区交集对齐校验。
  automated_regression: 通过仓库脚本或 CI 风格回归作业检查。
  semantic_contract_regression: 通过 semantic_contract build 或 compose_sql 回归检查。
  owner_confirmed: 经业务/数据 owner 确认，且未直接执行 SQL。
  not_applicable: 非 SQL 资产，或无需执行级别验证。
promotion_metrics:
  verified_sql_count: 统计 promotion_status 为 verified_sql 或 semantic_promoted 的条目数。
  high_frequency_question_coverage: verified SQL 与 semantic_contract 可覆盖的高频问题占比。
  draft_misrecall_count: 统计 draft / candidate_sql / needs_decision 被误当事实使用的案例数。
  rerun_failure_rate: 已验证 SQL 在重跑或漂移检查中失败的比例。
  needs_decision_block_rate: needs_decision 场景正确被阻断至 owner 决策的比例。
mcp_read_status_values:
  text_and_tables_readable: DingTalk MCP 返回 Markdown 文本与表格块。
  image_links_seen_but_not_ocr_verified: 检测到图片链接/图片块，但未做 OCR/视觉确认。
  partial_link_ingested: 周更同步或源文本已读取，但部分提及链接未能按 nodeId 访问。
  html_file_downloaded_and_text_extracted: DingTalk MCP 命中 HTML 节点并解析下载签名，提取了文本。
  not_applicable: 不需要 MCP 解析。
image_status_values:
  no_image: 源数据无图片依赖。
  images_archived: 图片已作为证据归档，但未做提取。
  reviewed_image_extracts: 图片已人工复核，清晰表格/图示已提取并产出摘要。
  table_images_ocr_pending: 表格截图可做 OCR，但尚未完成复核。
  table_images_ocr_verified: 表格截图已提取并复核通过。
  charts_need_source_data: 图表截图用于数值推断时需保留原始图表数据。
  dense_images_archive_only: 密集热力图/矩阵类仅归档，不做解析。
  needs_better_source: 图片质量不足，需更好的来源重提取。
